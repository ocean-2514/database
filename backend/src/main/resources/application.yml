# =============================================================
# 服务器端配置
# 数据库连接: 本机 MySQL 的 poetry_db (先执行 sql/01~07 初始化)
# =============================================================
server:
  port: 8080

spring:
  config:
    # 导入本地个人配置(存放真实密码, 已被 .gitignore 排除, 不会提交)。
    # 两条路径兼容两种运行方式:
    #   在 backend 目录下运行            -> ./application-local.yml
    #   在仓库根目录运行(IDEA 默认工作目录) -> ./backend/application-local.yml
    # 文件不存在也不报错。优先级: 环境变量 DB_PASSWORD > 本文件里的配置
    import:
      - optional:file:./application-local.yml
      - optional:file:./backend/application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/poetry_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    #   真实密码在 backend/application-local.yml (每个组员各配各的)
    #   或通过环境变量 DB_PASSWORD 提供(优先级更高)
    #   都没配时用下面的占位符, 启动会报数据库登录失败, 属正常提示
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # mapper XML 位置: 所有 SQL 语句都手写在这些 XML 文件里
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 数据库 snake_case 列名 自动映射到 Java camelCase 属性: create_year -> createYear
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    # 开发期打印 SQL 语句, 便于调试与截图
    com.poetry.mapper: debug
